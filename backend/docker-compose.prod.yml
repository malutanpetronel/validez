#
# Validez - Backend (Symfony / API Platform)
# Productie: expus prin Nginx_Proxy ca https://${VIRTUAL_HOST}
# Se ruleaza din <release>/backend (repository-ul e monorepo: backend/ + frontend/).
#
# 3.5: necesar pentru numele explicit al retelei interne (docker-compose 1.29 pe server).
version: "3.5"

services:
    db:
        container_name: ${DB_CONTAINER}
        image: postgres:16-alpine
        restart: always
        volumes:
            - /srv/www/${VIRTUAL_HOST}/db_data:/var/lib/postgresql/data
            - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        networks:
            - internal

    php:
        container_name: ${PHP_CONTAINER}
        # Tag-ul sta in .env-ul de pe server (afisat de ./docker-build-push.sh), nu in repository.
        image: ${DOCKER_IMAGE}
        restart: always
        depends_on:
            - db
        volumes:
            - ./:/var/www/validez-be:rw
            # .env din shared e symlink (ansistrano): montat explicit ca fisier, altfel symlink-ul nu se rezolva in container.
            - ./.env:/var/www/validez-be/.env:ro
            # Uploadurile: persistente intre release-uri (shared), nu in codul release-ului.
            - /var/www/validez-be/shared/backend/public/uploads:/var/www/validez-be/public/uploads:rw
            - /var/www/validez-be/shared/backend/var:/var/www/validez-be/var:rw
            - /var/www/validez-be/shared/backend/vendor:/var/www/validez-be/vendor:rw
            - /var/www/validez-be/shared/backend/config/jwt:/var/www/validez-be/config/jwt:ro
        environment:
            APP_ENV: prod
            DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?serverVersion=16&charset=utf8"
        networks:
            internal:
                # fastcgi_pass din nginx/default.conf; nume unic, ca nginx sa nu ajunga la PHP-ul altui proiect.
                aliases: [validez-fpm]

    nginx:
        container_name: ${NGINX_CONTAINER}
        image: nginx:stable-alpine
        restart: always
        depends_on:
            - php
        expose:
            - 80
        volumes:
            # Nginx doar serveste static: read-only.
            - ./public:/var/www/validez-be/public:ro
            - /var/www/validez-be/shared/backend/public/uploads:/var/www/validez-be/public/uploads:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        environment:
            VIRTUAL_HOST: ${VIRTUAL_HOST}
            VIRTUAL_PORT: 80
            LETSENCRYPT_HOST: ${VIRTUAL_HOST}
        networks:
            - internal
            - proxy

networks:
    proxy:
        external: true
    # Retea privata DB/PHP. Pe "proxy" numele "php"/"db" sunt comune cu alte proiecte
    # (lectie ArtaNFT 01.10.2026: nginx impartea cererile intre PHP-uri, "db" era ambiguu).
    internal:
        name: validez_be_internal
