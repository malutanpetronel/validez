        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        registration_confirm:
            policy: sliding_window
            limit: 15
            interval: '1 hour'
        captcha_challenge:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        password_reset:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        password_reset_email:
            policy: sliding_window
            limit: 1
            interval: '1 minute'
        password_reset_confirm:
            policy: sliding_window
            limit: 15
            interval: '1 hour'
        # L.5b: „Șterge-mi contul” — cererea linkului (per cont) și confirmarea (per IP).
        account_deletion:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        account_deletion_confirm:
            policy: sliding_window
            limit: 15
            interval: '1 hour'
