security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Fara "property": UserRepository::loadUserByIdentifier normalizeaza emailul (lowercase).
        app_users:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Plan Step 1.4: navigare publica; modificarea structurii rezervata administratorilor
        # (voter TREE_EDIT). Toata zona /api e stateless (api_platform.defaults.stateless).
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            entry_point: jwt
            # POST /api/auth {email, password} -> {token, refresh_token}
            json_login:
                check_path: api_auth
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # 5 incercari gresite / minut, per utilizator si per IP
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            # Authorization: Bearer <token>
            jwt: ~
            # POST /api/token/refresh {refresh_token} -> {token, refresh_token} (rotatie, single_use)
            refresh_jwt:
                check_path: api_refresh_token

    access_control:
        - { path: ^/api/(auth|token/refresh)$, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
