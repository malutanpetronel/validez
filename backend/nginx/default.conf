# ADR-0008: tot ce se cere pe validez-be.webnou.ro (API, uploaduri) poate fi citit - si de Google, la randarea
# paginilor FE - dar nu indexat. Exceptie: cererile venite prin nginx-ul FE (Host validez.webnou.ro), adica
# paginile publice /categorie/... si sitemap-ul, care trebuie indexate. Valoare goala = header netrimis.
map $host $validez_robots_tag {
    validez.webnou.ro "";
    default "noindex";
}

# ADR-0010: scrierile de vot, acordul pentru vot si exportul propriu nu ajung in logul de acces
# (IP + moment + ruta permit corelarea cu jurnalul de integritate). Restul cererilor se logheaza normal.
# Aceeasi lista in nginx/proxy-log-map.conf.prod (Nginx_Proxy) - se modifica impreuna.
map "$request_method $request_uri" $validez_access_log {
    "~^(PUT|DELETE) /api/civic_subjects/[^/]+/votes/" 0;
    "~^[A-Z]+ /api/me/vote-consent" 0;
    "~^GET /api/me/votes" 0;
    default 1;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/validez-be/public;

    add_header X-Robots-Tag $validez_robots_tag always;

    access_log /var/log/nginx/access.log main if=$validez_access_log;

    client_max_body_size 50m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Uploadurile sunt numai fisiere statice; nu ajung niciodata la PHP-FPM.
    location ^~ /uploads/ {
        add_header X-Content-Type-Options nosniff always;
        # add_header in acest bloc anuleaza mostenirea celor din server: il repetam.
        add_header X-Robots-Tag $validez_robots_tag always;
        location ~* \.(?:php[0-9]*|phtml|phar|html?|svg|shtml)(?:/|$) {
            return 404;
        }
        try_files $uri =404;
    }

    location = /index.php {
        # Alias unic (nu "php"): vezi docker-compose*.yml
        fastcgi_pass validez-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) {
        return 404;
    }
}
