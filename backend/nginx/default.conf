server {
    listen 80;
    server_name localhost;
    root /var/www/validez-be/public;

    client_max_body_size 50m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Uploadurile sunt numai fisiere statice; nu ajung niciodata la PHP-FPM.
    location ^~ /uploads/ {
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(?:php[0-9]*|phtml|phar|html?|svg|shtml)(?:/|$) {
            return 404;
        }
        try_files $uri =404;
    }

    location = /index.php {
        # Alias unic (nu "php"): vezi docker-compose*.yml
        fastcgi_pass validez-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) {
        return 404;
    }
}
