; ADR-0010: imaginea oficiala php-fpm scrie un log de acces (IP-ul nginx-ului, moment, metoda) pe stderr.
; Nu are ruta, dar momentul unui PUT se poate corela cu jurnalul de integritate; nginx are deja logul de acces.
; Montat read-only din docker-compose.prod.yml; se incarca dupa docker.conf (ordine alfabetica), deci il suprascrie.
[www]
access.log = /dev/null
