#
# Validez - Frontend (React + MUI, build static servit de nginx)
# Productie: expus prin Nginx_Proxy ca https://validez.webnou.ro
# Imaginea se construieste local cu ./docker-build-push.sh; tag-ul sta in /var/www/validez-fe/shared/frontend/.env
#
version: "3"

services:
    web:
        container_name: ${WEB_CONTAINER}
        image: ${DOCKER_IMAGE}
        restart: always
        expose:
            - 80
        environment:
            VIRTUAL_HOST: ${VIRTUAL_HOST}
            VIRTUAL_PORT: 80
            LETSENCRYPT_HOST: ${VIRTUAL_HOST}
        networks:
            - proxy

networks:
    proxy:
        external: true
