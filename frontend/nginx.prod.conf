server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Assets CRA cu hash in nume: cache 1 an. ^~ opreste cautarea in regex-urile de mai jos,
    # altfel regex-ul pe extensii castiga si acest bloc nu se aplica niciodata (lectie ArtaNFT).
    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html fara cache: dupa deploy, browserul ia imediat noile nume de assets.
    # Se aplica si fallback-ului SPA (try_files ... /index.html face redirect intern aici).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fisiere statice care NU exista -> 404 real, nu index.html (200+HTML). Altfel cordova.js,
    # real doar in build-urile Cordova, primeste HTML si browserul crapa cu "Unexpected token '<'".
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|map|json)$ {
        try_files $uri =404;
    }

    # ADR-0008: paginile publice si sitemap-ul le genereaza Symfony (validez_be_nginx, retea comuna "proxy").
    # Rezolvare la cerere (resolver Docker + variabila): FE porneste si cand BE nu ruleaza.
    # 404/301 vin de la Symfony neschimbate; doar BE oprit/inaccesibil (502-504) cade pe aplicatia React.
    location ~ ^/categorie(/|$) {
        resolver 127.0.0.11 valid=30s;
        set $validez_be http://validez_be_nginx;
        proxy_pass $validez_be;
        proxy_set_header Host validez.webnou.ro;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    # Sitemap: fara fallback pe aplicatie - cu BE oprit, Google primeste 502 si revine, nu HTML in loc de XML.
    location ~ ^/sitemap(\.xml$|/) {
        resolver 127.0.0.11 valid=30s;
        set $validez_be http://validez_be_nginx;
        proxy_pass $validez_be;
        proxy_set_header Host validez.webnou.ro;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # og:image (prima fotografie publicata a subiectului) pe domeniul public: BE-ul are robots Disallow, iar
    # Twitterbot respecta robots.txt. ^~ castiga in fata regex-ului pentru .jpg de mai sus. Fara fallback pe aplicatie.
    location ^~ /media/og/ {
        resolver 127.0.0.11 valid=30s;
        set $validez_be http://validez_be_nginx;
        proxy_pass $validez_be;
        proxy_set_header Host validez.webnou.ro;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # React Router - orice ruta fara extensie statica cade pe index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
