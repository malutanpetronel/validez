<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#073568" />
    <meta name="description" content="VALIDEZ — Vezi. Verifică. Validează." />
    <title>VALIDEZ — Vezi. Verifică. Validează.</title>
    <meta property="og:title" content="VALIDEZ — Vezi. Verifică. Validează." />
    <meta property="og:description" content="Vezi. Verifică. Validează." />
    <meta property="og:url" content="https://validez.webnou.ro" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VALIDEZ" />
    <!-- ADR-0008: previzualizarea la partajare (1200x630); adresa absoluta, ceruta de Facebook/LinkedIn/WhatsApp. -->
    <meta property="og:image" content="https://validez.webnou.ro/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VALIDEZ Live! — Vezi. Verifică. Validează. — validez.webnou.ro" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <style>
      /* Ecran de încărcare (src/splash.js): acoperă rezumatul SEO nestilizat din #root și primele randări,
         până când pagina are datele (arbore, subiect, fotografii). Rezumatul rămâne în DOM pentru crawlere. */
      #splash { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 24px; background: #dfedff; transition: opacity .2s ease; }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      #splash img { display: block; width: 128px; height: auto; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #121212; }
        #splash img { background: #dfedff; border-radius: 50%; padding: 14px; }
      }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
  </head>
  <body>
    <noscript>Activează JavaScript pentru a folosi aplicația.</noscript>
    <div id="splash" role="status" aria-label="Se încarcă VALIDEZ"><img src="%PUBLIC_URL%/logo-splash.svg" alt="" width="128" height="132" /></div>
    <div id="root"></div>
  </body>
</html>
